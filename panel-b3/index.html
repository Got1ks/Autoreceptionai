<style>
/* VOICE work tool, calm; read-only stage
   IDEA the workshop day sheet: large hanging times, one ticket per job
   PICTURE the day list itself, tickets coloured by who booked them
   COLOUR white / night graphite, ink, signal orange for actions, blue voice, grey calendar
   TYPE Archivo
   LAYOUT phone: header, list, bottom tabs; desktop: left rail */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121416);--ink:light-dark(#15181b,#eceef0);--mut:light-dark(#5d6670,#9aa3ad);--line:light-dark(#e3e6ea,#2b2f35);--panel:light-dark(#f2f4f6,#1c1f23);--acc:#ff5a1f;--voice:light-dark(#2f6fde,#7aa4f2);--cal:light-dark(#5b6570,#a3acb6);--warn:light-dark(#a86d00,#f0b43a);--bad:light-dark(#c62828,#ff7272);--ok:light-dark(#1f8a4c,#55c98a)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
h1{font-size:22px}
h2{font-size:20px;margin-bottom:10px}
h3{font-size:16px;font-weight:700}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 16px;border-bottom:1px solid var(--line)}
header .grow{flex:1 1 140px}
header small{display:block;color:var(--mut);font-size:13px}
main{overflow:auto;padding:12px 16px 28px}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;position:relative}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--ink)}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--acc)}
nav .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--acc);color:#fff;border-radius:9px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
nav .brand{display:none}
@media(min-width:900px){body{grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}nav{grid-row:1/3;grid-column:1;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 10px;gap:4px}nav .brand{display:block;font-weight:800;font-size:17px;padding:6px 10px 14px}nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;min-height:46px;padding:0 12px;font-size:15px;border-radius:10px}nav button[aria-current=page]{background:var(--panel)}nav button[aria-current=page]::before{top:10px;bottom:10px;left:0;right:auto;width:3px;height:auto}nav .badge{position:static;margin-left:auto}header,main{grid-column:2}main{padding:16px 24px 32px}}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--mut)}
.btn:focus-visible,nav button:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;min-height:40px;padding:0 12px;font-weight:600;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.datenav{display:flex;gap:4px}
.datenav .btn{min-width:44px;padding:0 8px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;background:var(--panel);white-space:nowrap}
.tag.voice{background:color-mix(in srgb,var(--voice) 16%,var(--bg));color:var(--voice)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,var(--bg));color:var(--warn)}
.tag.ok{background:color-mix(in srgb,var(--ok) 16%,var(--bg));color:var(--ok)}
.tag.ro{background:color-mix(in srgb,var(--ok) 14%,var(--bg));color:var(--ok)}
.tag.demo{background:color-mix(in srgb,var(--warn) 18%,var(--bg));color:var(--warn)}
.mut{color:var(--mut)}
.note{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px;background:var(--panel)}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,var(--bg))}
.day{display:grid;gap:8px;max-width:760px}
.job{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-left:5px solid var(--c,var(--cal));border-radius:12px}
.job .t{font-weight:800;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.job .t small{display:block;font-weight:500;font-size:13px;color:var(--mut)}
.job p{margin:2px 0;overflow-wrap:anywhere}
.job .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.job .tags .tag{white-space:normal}
.job.voice{--c:var(--voice)}
.job[data-ev]{cursor:pointer}.job[data-ev]:focus-visible{outline:3px solid var(--voice);outline-offset:2px}
.chg{padding:8px 0;border-top:1px solid var(--line)}.chg .was{text-decoration:line-through;opacity:.65;overflow-wrap:anywhere}.chg .now{font-weight:700;overflow-wrap:anywhere}
.job.ext{--c:var(--cal);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--mut) 8%,transparent) 0 8px,transparent 8px 16px)}
.empty{padding:28px 16px;text-align:center;background:var(--panel);border-radius:14px;max-width:760px}
.week{display:grid;gap:8px;max-width:760px}
.wrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;cursor:pointer;width:100%}
.wrow.today{border-color:var(--acc)}
.wrow b{display:block;font-size:17px}
.wrow .n{font-size:20px;font-weight:800;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:18px;min-height:36px;padding:6px 12px;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fld{display:grid;gap:4px;margin-bottom:10px}
.fld label{font-size:14px;font-weight:600}
.fld select,.fld input{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px;background:var(--bg)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;max-width:760px}
.card p{margin:4px 0;overflow-wrap:anywhere}
.list{display:grid;gap:8px}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.login .box{width:min(400px,100%)}
.login h1{font-size:32px;margin-bottom:8px}
#gbtn{min-height:44px;margin:16px 0}
.small{font-size:13px;color:var(--mut)}
code{font-size:14px;background:var(--panel);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.loading{opacity:.6}
.chip[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.fld textarea{min-height:70px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px;background:var(--bg);font:inherit}
.fld .err{color:var(--bad);font-size:14px}
.fld input[aria-invalid="true"],.fld select[aria-invalid="true"]{border-color:var(--bad)}
.note.good{background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
@media(max-width:899px){nav button{min-width:0;font-size:11px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:8px 0}.kv dt{opacity:.7;font-size:14px}.kv dd{margin:0;font-weight:600}
.big{width:100%;min-height:50px;font-size:17px}
</style>
</head>
<body>
<div class="login" id="login">
  <div class="box">
    <h1>Панель автосервиса</h1>
    <p class="mut">Вход только для сотрудников из списка. Доступ проверяется на сервере при каждом запросе.</p>
    <div id="gbtn"></div>
    <div id="lmsg"></div>
    <p class="small">Режим только для чтения: расписание демо-календаря проекта и журнал заявок. Изменить ничего нельзя.</p>
  </div>
</div>

<header id="hdr"></header>
<main id="main"></main>
<nav id="nav" aria-label="Разделы">
  <div class="brand">AutoReception</div>
  <button data-tab="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Расписание</button>
  <button data-tab="new"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Записать</button>
  <button data-tab="requests"><svg viewBox="0 0 24 24"><path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>Заявки<span class="badge" id="rqb" hidden></span></button>
  <button data-tab="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/></svg>Клиенты</button>
  <button data-tab="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>ИИ-чат</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Ещё</button>
</nav>

<script>
{
// ===== НАСТРОЙКИ (не секреты) =====
const CLIENT_ID = '156627881891-q50bqubjoaf3v3lpkhhtpgo4pc2fu2jj.apps.googleusercontent.com';
const API = 'https://autoreception.app.n8n.cloud/webhook/autoreception/panel-api';
const PROTOTYPE = 'https://claude.ai/artifact/EC3x2YduHiHBBCUMaydvR7';
// ==================================
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const tzToday = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Riga' }).format(new Date());
const parse = (s) => { const [a, b, c] = s.split('-').map(Number); return new Date(Date.UTC(a, b - 1, c)); };
const iso = (d) => d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
const add = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const dow = (s) => parse(s).getUTCDay();
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'], WDF = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const human = (s) => { const d = parse(s); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const nowHM = () => new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Riga', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date());
// Состояние дня для подписи: прошёл / закрыт / рабочее время закончилось / идёт / впереди.
function dayState(day, date) {
  const t = tzToday();
  if (date < t) return 'past';
  if (!day || !day.open) return 'closed';
  if (date === t) { const n = nowHM(); if (n >= day.close) return 'over'; if (n >= day.open) return 'now'; }
  return 'ahead';
}
const weekStart = (s) => { let d = s; while (dow(d) !== 1) d = add(d, -1); return d; };

// Токен Google хранится только в памяти страницы (не в localStorage/cookie).
let token = null, tokenExp = 0, me = null, bodyType = 'text';
let tab = 'schedule', view = 'day', cur = tzToday();
const weeks = {};       // кэш: начало недели -> { at, data | error }
let reqs = null;         // { at, data | error }
const FRESH = 5 * 60 * 1000;
// Поколение сессии: меняется при входе, выходе, истечении и отказе. Ответ, пришедший после смены
// поколения, отбрасывается — данные прошлой сессии не попадут на экран и в кэш.
let gen = 0;
const inflight = {};     // ключ -> { gen, p } — один запрос на неделю/журнал одновременно
const isDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isTime = (s) => typeof s === 'string' && /^\d{2}:\d{2}$/.test(s);
function clearSession() {
  gen++;
  token = null; tokenExp = 0; me = null;
  for (const k in weeks) delete weeks[k];
  for (const k in inflight) delete inflight[k];
  reqs = null; ed = null; edSeq++; // ed объявлена ниже; clearSession вызывается только после загрузки скрипта
  $('#main').innerHTML = ''; $('#hdr').innerHTML = '';
  const bd = $('#rqb'); if (bd) { bd.hidden = true; bd.textContent = ''; }
}

function b64json(part) { try { return JSON.parse(decodeURIComponent(escape(atob(part.replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return null; } }

async function api(body) {
  const g = gen;
  if (!token || Date.now() / 1000 > tokenExp - 30) { expire(); throw { code: 'TOKEN_EXPIRED' }; }
  // Токен — в теле POST, не в адресе. Сначала text/plain (без предварительного CORS-запроса);
  // если сервер не разобрал тело (NO_TOKEN при отправленном токене) или браузер отказал — один повтор как JSON.
  const send = (ct) => fetch(API, { method: 'POST', mode: 'cors', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', headers: { 'Content-Type': ct }, body: JSON.stringify(Object.assign({ id_token: token }, body)) });
  let res = null, data = null;
  for (const ct of bodyType === 'json' ? ['application/json'] : ['text/plain;charset=UTF-8', 'application/json']) {
    // commit при обрыве не переотправляется автоматически: итог узнаём через op_status (повтор безопасен на сервере, но не нужен).
    try { res = await send(ct); } catch (e) { res = null; if (body.op === 'commit') break; continue; }
    try { data = await res.json(); } catch (e) { data = null; }
    if (data && data.error_code === 'NO_TOKEN' && ct.startsWith('text/')) continue;
    if (ct === 'application/json') bodyType = 'json';
    break;
  }
  if (g !== gen) throw { code: 'STALE' }; // сессия сменилась, пока шёл запрос
  if (!res) throw { code: 'NETWORK' };
  if (!data) throw { code: 'BAD_RESPONSE', http: res.status };
  if (!res.ok || !data || data.ok === false) {
    const err = { code: (data && data.error_code) || 'HTTP_' + res.status, http: res.status, whoami: data && data.whoami, data };
    if (err.code === 'TOKEN_EXPIRED' || err.http === 401) expire(err);
    if (err.code === 'NOT_ALLOWED') denied(err);
    throw err;
  }
  return data;
}

const ERR = {
  NETWORK: 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.',
  BAD_RESPONSE: 'Сервер ответил непонятно. Ничего не показано, чтобы не ввести в заблуждение.',
  CALENDAR_UNAVAILABLE: 'Календарь сейчас недоступен. Расписание не показано.',
  SHEETS_UNAVAILABLE: 'Журнал заявок сейчас недоступен.',
  AUTH_CHECK_UNAVAILABLE: 'Не удалось проверить вход (ключи Google недоступны). Попробуйте через минуту.',
  AUTH_NOT_CONFIGURED: 'Вход на сервере ещё не настроен.',
  TOKEN_EXPIRED: 'Сессия истекла. Войдите снова.',
  NOT_ALLOWED: 'Этого аккаунта нет в списке разрешённых.',
  RANGE_TOO_LONG: 'Слишком длинный период.',
};
const errText = (e) => ERR[e.code] || ('Ошибка загрузки: ' + esc(e.code || 'неизвестно'));

function onCredential(resp) {
  const t = resp && resp.credential;
  const p = t ? b64json(t.split('.')[1] || '') : null; // только для отображения; проверяет сервер
  if (!t || !p) { $('#lmsg').innerHTML = '<div class="note bad">Google не вернул данные входа.</div>'; return; }
  clearSession(); // новый вход — всегда с чистым кэшем, даже если аккаунт тот же
  token = t; tokenExp = Number(p.exp) || 0; me = { email: String(p.email || ''), name: String(p.name || '') };
  const g = gen;
  $('#lmsg').innerHTML = '<p class="mut">Проверяю доступ…</p>';
  loadWeek(weekStart(cur), true).then((w) => {
    if (g !== gen) return;
    const e = w && w.error;
    // Не удалось связаться или проверить вход — остаёмся на экране входа. Календарь недоступен — вход подтверждён, открываем.
    if (e && (['NETWORK', 'BAD_RESPONSE', 'AUTH_CHECK_UNAVAILABLE', 'AUTH_NOT_CONFIGURED'].includes(e.code) || /^HTTP_/.test(e.code))) {
      clearSession(); // токен не держим, пока панель закрыта; для «Повторить» он остаётся только в этом замыкании
      $('#lmsg').innerHTML = '<div class="note bad">' + errText(e) + '</div><button class="btn" id="retry">Повторить</button>';
      $('#retry').onclick = () => onCredential({ credential: t });
      return;
    }
    $('#login').hidden = true;
    loadRequests(true);
    render();
  }, (e) => {
    if (g !== gen || e.code === 'STALE') return;
    if (e.code !== 'NOT_ALLOWED') { clearSession(); $('#lmsg').innerHTML = '<div class="note bad">' + errText(e) + '</div>'; }
  });
}
function denied(e) {
  clearSession();
  const w = e.whoami || {};
  $('#login').hidden = false;
  $('#lmsg').innerHTML = '<div class="note bad"><b>Доступ не разрешён.</b> Подпись Google подтверждена, но этого аккаунта нет в списке сотрудников.' +
    (w.sub ? '<br>Если это ваш рабочий аккаунт, передайте разработчику этот идентификатор (он не секретный):<br><code id="sub">' + esc(w.sub) + '</code> <button class="btn" id="copysub" style="min-height:36px">Копировать</button>' : '') + '</div>';
  const b = $('#copysub'); if (b) b.onclick = () => { try { navigator.clipboard.writeText(w.sub).then(() => { b.textContent = 'Скопировано'; }, () => {}); } catch (x) {} };
}
function expire(e) {
  clearSession();
  $('#login').hidden = false;
  $('#lmsg').innerHTML = '<div class="note warn">' + (e && e.code && e.code !== 'TOKEN_EXPIRED' ? errText(e) : 'Сессия истекла. Войдите снова.') + '</div>';
  try { google.accounts.id.prompt(); } catch (x) {}
}
function initGoogle() {
  if (!CLIENT_ID) { $('#lmsg').innerHTML = '<div class="note warn">Вход ещё не настроен: нет Client ID Google.</div>'; return; }
  if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(initGoogle, 300); return; }
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false, ux_mode: 'popup', use_fedcm_for_prompt: true });
  google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ru' });
  google.accounts.id.prompt();
}

function loadWeek(ws, force) {
  const c = weeks[ws];
  if (!force && c && c.data && Date.now() - c.at < FRESH) return Promise.resolve(c);
  const key = 'w:' + ws, f = inflight[key];

    try { const data = await api({ op: 'range', from: ws, to: add(ws, 6) }); if (g === gen) weeks[ws] = { at: Date.now(), data }; }

  if (f && f.gen === gen) return f.p;
  const g = gen;
  const p = (async () => {
    try { const data = await api({ op: 'requests', status: 'open', limit: 100 }); if (g === gen) reqs = { at: Date.now(), data }; }
    catch (e) { if (g !== gen || e.code === 'STALE') return; reqs = { at: Date.now(), error: e }; }

  if (code === 'OP_NOT_EXECUTED') return { kind: 'error', title: 'Запись не создана', text: 'Подтверждение не дошло до сервера. Данные формы после перезагрузки не сохраняются — заполните запись заново.' };

  return { kind: 'error', title: 'Ошибка', text: E2[code] || ERR[code] || ('Код: ' + esc(code || 'неизвестно')) };
}

async function nbCommit() {

// Проверка итога по op_status: до 40 раз раз в 3 с. Сервер сам сверяет с календарём зависшую операцию.
async function nbPoll(opId, n, manual) {
  if (!opId || !nb) return;
  let code, d;
  try { d = await api({ op: 'op_status', op_id: opId }); code = d.result || (d.status === 'prepared' ? 'NOT_EXECUTED' : 'UNKNOWN'); }
  catch (e) { if (e.code === 'STALE') return; code = e.code; d = e.data || {}; if (code === 'NETWORK') code = nb.res ? nb.res.code : 'BOOKING_UNCERTAIN'; }
  if (!nb || !nb.res || (nb.res.d && nb.res.d.op_id && nb.res.d.op_id !== opId)) return;
  if (code === 'NOT_EXECUTED') code = 'OP_NOT_EXECUTED';
  nb.res = { code, d: Object.assign({ op_id: opId }, d) };
  if (code !== 'OP_IN_PROGRESS' && code !== 'BOOKING_UNCERTAIN') saveOp('');
  if (tab === 'new') render();
  if ((code === 'OP_IN_PROGRESS') && n < 40) setTimeout(() => nbPoll(opId, n + 1), 3000);
}

    m.innerHTML = `<form id="edform" novalidate><div class="card" style="margin-bottom:12px"><dl class="kv" style="margin:0">${fixed}</dl><p class="small" style="margin:6px 0 0">Дата, время и работа здесь не меняются.</p></div>
      ${ed.msg ? `<div class="note warn" style="margin-bottom:10px">${esc(ed.msg)}</div>` : ''}
      ${fl('customer_name', ip('customer_name', 'text'))}${fl('phone', ip('phone', 'tel', 'inputmode="tel"'))}
      <div class="row2">${fl('car_make', ip('car_make', 'text'))}${fl('car_model', ip('car_model', 'text'))}</div>
      ${fl('notes', `<textarea id="ed_notes" maxlength="500">${esc(f.notes)}</textarea>`)}
      <button class="btn pri big" id="edcheck" type="submit"${ed.busy ? ' disabled' : ''}>${ed.busy ? 'Проверяю…' : 'Проверить изменения'}</button>
      <p><button class="btn" type="button" id="edcancel"${ed.busy ? ' disabled' : ''}>Отменить</button></p>
      <div id="edmsg">${ed.err2 ? `<div class="note bad">${eText(ed.err2)}</div>` : ''}</div></form>`;
    $('#edform').onsubmit = (ev) => { ev.preventDefault(); edSync(); edPrepare(); };
    return;
  }
  if (st === 'check') {
    const ch = (ed.prep.changes || []).filter((c) => ED_F.includes(c.field));
    m.innerHTML = `<div class="card"><h3>Будет изменено</h3>
      ${ch.map((c) => `<div class="chg"><div class="small">${esc(ED_L[c.field])}</div><div class="was">${esc(c.from) || '<i>пусто</i>'}</div><div class="now">→ ${esc(c.to) || '<i>пусто</i>'}</div></div>`).join('')}
      <p class="small">Работа и время не меняются: ${esc(bk.service_name)}, ${esc(when)}. Проверка действует 10 минут. Если за это время запись изменит кто-то другой (сотрудник или голосовой ИИ), ваши правки не перезапишут его изменения.</p>
      <button class="btn pri big" id="edok"${ed.busy ? ' disabled' : ''}>${ed.busy ? 'Сохраняю…' : 'Сохранить'}</button>
      <p><button class="btn" id="edfix"${ed.busy ? ' disabled' : ''}>Исправить</button></p></div>`;
    return;
  }
  // result
  const o = edOutcome(ed.res.code, ed.res.d), d = ed.res.d || {};
  const cls = { ok: 'good', warn: 'warn', running: 'warn', unknown: 'warn', changed: 'warn', failed: 'bad', off: 'warn', error: 'bad', expired: 'warn' }[o.kind];
  m.innerHTML = `<div class="note ${cls}" role="status"><h3 style="margin:0 0 6px">${o.title}</h3><p style="margin:0">${o.text}</p></div>
    ${ed.resumed && o.kind === 'running' ? '<p class="small">После перезагрузки страницы проверяю незавершённое сохранение.</p>' : ''}
    ${o.kind === 'failed' ? '<button class="btn big" id="edretry">Повторить сохранение</button>' : ''}
    ${o.kind === 'unknown' || o.kind === 'running' || (o.kind === 'ok' && d.journal === 'pending') ? '<button class="btn big" id="edstatus">Проверить результат</button>' : ''}
    ${o.kind === 'changed' ? '<button class="btn pri big" id="edreopen">Открыть запись заново</button>' : ''}
    ${o.kind === 'expired' ? '<button class="btn pri big" id="edrecheck">Проверить ещё раз</button>' : ''}
    <p>${['running', 'unknown', 'changed'].includes(o.kind) ? '' : '<button class="btn" id="edview">Открыть запись</button> '}<button class="btn" id="edback2">К расписанию</button></p>`;
}
function edSync() { ED_F.forEach((k) => { const el = $('#ed_' + k); if (el) ed.f[k] = el.value; }); }
function edOutcome(code, d) {
  d = d || {};
  const j = { ok: 'Журнал заявок обновлён.', pending: 'Журнал заявок обновится чуть позже — нажмите «Проверить результат».', recovery: 'Строки этой записи нет в журнале — она будет восстановлена автоматически уже с новыми данными.', superseded: 'Журнал уже содержит более новые данные.' };
  switch (code) {
    case 'UPDATED': return { kind: 'ok', title: 'Запись изменена', text: 'Календарь обновлён. ' + (j[d.journal] || j.pending) };
    case 'BOOKING_CHANGED': return { kind: 'changed', title: 'Запись изменилась после открытия', text: 'Пока вы редактировали, запись изменил другой сотрудник или голосовой ИИ. Ваши правки <b>не сохранены</b>, чужие изменения не затронуты. Откройте запись заново.' };
    case 'BOOKING_NOT_ACTIVE': return { kind: 'error', title: 'Запись отменена или удалена', text: 'Изменения не сохранены.' };
    case 'NOT_APPLIED': return { kind: 'failed', title: 'Не сохранено', text: 'Календарь не принял изменения, запись осталась прежней. Можно безопасно повторить.' };
    case 'EDIT_UNCERTAIN': return { kind: 'unknown', title: 'Результат пока неизвестен', text: 'Связь прервалась во время сохранения. Изменения могли сохраниться или нет — <b>не вводите их заново</b>, нажмите «Проверить результат».' };
    case 'OP_IN_PROGRESS': return { kind: 'running', title: 'Сохраняю…', text: 'Операция выполняется. Не закрывайте страницу.' };
    case 'NOT_EXECUTED': return { kind: 'expired', title: 'Сохранение не выполнялось', text: 'Изменения не отправлены. Проверьте их ещё раз.' };
    case 'PROPOSAL_EXPIRED': return { kind: 'expired', title: 'Проверка устарела', text: 'С момента проверки прошло больше 10 минут. Ничего не изменено — проверьте изменения ещё раз.' };
    case 'WRITES_DISABLED': return { kind: 'off', title: 'Изменение записей выключено', text: 'Изменение записей из панели сейчас выключено на сервере. Ничего не изменено.' };
    case 'OP_PAYLOAD_MISMATCH': return { kind: 'error', title: 'Данные не совпали с проверенными', text: 'Ничего не изменено. Проверьте изменения ещё раз.' };
    default: return { kind: 'error', title: 'Не удалось сохранить', text: esc(NE[code] || EERR[code] || ERR[code] || ('Код: ' + code)) + ' Если сомневаетесь, сохранилось ли, откройте запись заново.' };
  }
}
async function edPrepare() {
  if (ed.busy) return;
  ed.errs = edValidate(ed.f); ed.err2 = null; ed.msg = '';
  if (Object.keys(ed.errs).length) { render(); const first = $('[aria-invalid="true"]'); if (first) first.focus(); return; }
  const same = ED_F.every((k) => String(ed.f[k]).replace(/\s+/g, ' ').trim() === String((ed.bk.fields || {})[k] || ''));
  if (same) { ed.err2 = { code: 'NO_CHANGES' }; render(); return; }
  ed.busy = true; render();
  const ref = ed;
  try {
    const r = await api({ op: 'prepare_edit', event_id: ed.bk.event_id, booking_id: ed.bk.booking_id, base_etag: ed.bk.etag, fields: Object.assign({}, ed.f) });
    if (ref !== ed) return;
    ed.prep = r; ed.sent = Object.assign({}, ed.f); ed.draft = (r.changes || []).map((c) => ({ field: c.field, from: c.from, to: ed.f[c.field] })); ed.step = 'check';
  } catch (e) {
    if (ref !== ed || e.code === 'STALE') return;
    if (e.code === 'NO_CHANGES') ed.err2 = e;
    else if (e.code === 'BOOKING_CHANGED') { ed.busy = false; const cf = ed.bk.fields || {}; ed.draft = ED_F.filter((k) => String(ed.f[k]).trim() !== String(cf[k] || '')).map((k) => ({ field: k, from: cf[k] || '', to: ed.f[k] })); return edLoad(true); }
    else if (e.code === 'INVALID_FIELDS') { const fe = (e.data && e.data.field_errors) || {}; Object.keys(fe).forEach((k) => { if (ED_F.includes(k)) ed.errs[k] = 'Сервер не принял это значение'; }); ed.err2 = e; }
    else if (NE[e.code]) { ed.busy = false; ed.res = { code: e.code, d: {} }; ed.step = 'result'; render(); return; }
    else ed.err2 = e;
  } finally { if (ref === ed) ed.busy = false; }
  render();
}
async function edCommit() {
  if (ed.busy || !ed.prep) return;
  ed.busy = true; render();
  const ref = ed, opId = ed.prep.op_id;
  edSave({ op_id: opId, event_id: ed.id });
  let code, d;
  try { d = await api({ op: 'commit_edit', op_id: opId, payload_hash: ed.prep.payload_hash, fields: ed.sent }); code = d.result || 'UPDATED'; }
  catch (e) {
    if (e.code === 'STALE') return;
    d = (e.data && typeof e.data === 'object') ? e.data : {};
    // Обрыв связи или непонятный ответ после отправки — итог неизвестен, узнаём через edit_status.
    code = ['NETWORK', 'BAD_RESPONSE'].includes(e.code) || /^HTTP_5/.test(e.code) ? 'EDIT_UNCERTAIN' : (d.result || e.code);
  }
  if (ref !== ed) return;
  ed.busy = false;
  edSetRes(opId, code, d);
  if (code === 'EDIT_UNCERTAIN') setTimeout(() => edPoll(opId, 1), 1500); // сразу уточняем итог по серверу
}
function edSetRes(opId, code, d) {
  ed.res = { code, d: Object.assign({ op_id: opId }, d) }; ed.step = 'result';
  if (code !== 'OP_IN_PROGRESS' && code !== 'EDIT_UNCERTAIN' && !(code === 'UPDATED' && d && d.journal === 'pending')) edSave(null);
  render();
  if (code === 'OP_IN_PROGRESS') setTimeout(() => edPoll(opId, (ed && ed.polls || 0) + 1), 3000);
}
async function edPoll(opId, n, manual) {
  if (!ed || (ed.res && ed.res.d && ed.res.d.op_id !== opId) || ed.busy) return;
  if (!manual && n > 40) return;
  ed.polls = n; ed.busy = true;
  const ref = ed;
  let code, d;
  try { d = await api({ op: 'edit_status', op_id: opId }); code = d.result; }
  catch (e) { if (e.code === 'STALE') return; d = (e.data && typeof e.data === 'object') ? e.data : {}; code = d.result || (['NETWORK', 'BAD_RESPONSE'].includes(e.code) || /^HTTP_5/.test(e.code) ? 'EDIT_UNCERTAIN' : e.code); }
  if (ref !== ed) return;
  ed.busy = false;
  // Неизвестный итог при автоматической проверке: ещё несколько попыток, затем ждём кнопку.
  if (code === 'EDIT_UNCERTAIN' && !manual && n < 5) { ed.res = { code, d: Object.assign({ op_id: opId }, d) }; render(); setTimeout(() => edPoll(opId, n + 1), 3000); return; }
  edSetRes(opId, code, d);
}
function edResume() { // после перезагрузки: незавершённое сохранение
  const x = edSaved(); if (!x || ed) return;
  ed = { id: x.event_id, step: 'result', f: null, errs: {}, busy: false, resumed: true, res: { code: 'OP_IN_PROGRESS', d: { op_id: x.op_id } } };
  edPoll(x.op_id, 1, true);
}
function edClick(id) {
  switch (id) {
    case 'edback': case 'edback2': return edBack();
    case 'edreload': return edLoad();
    case 'edstart': { const f = ed.bk.fields || {}; ed.f = {}; ED_F.forEach((k) => (ed.f[k] = f[k] || '')); ed.errs = {}; ed.err2 = null; ed.msg = ''; ed.step = 'form'; return render(); }
    case 'edcancel': ed.step = 'view'; ed.f = null; return render();
    case 'edok': return edCommit();
    case 'edfix': if (ed.busy) return; ed.step = 'form'; ed.prep = null; return render();
    case 'edretry': ed.step = 'check'; return edCommit();
    case 'edstatus': return edPoll(ed.res.d.op_id, 0, true);
    case 'edreopen': ed.res = null; ed.prep = null; return edLoad(true);
    case 'edrecheck': if (!ed.bk) { ed.res = null; return edLoad(); } ed.prep = null; ed.res = null; ed.step = 'form'; if (!ed.f) ed.f = Object.assign({}, ed.sent || {}); return render();
    case 'edview': ed.res = null; ed.prep = null; ed.f = null; return edLoad();
  }
}

document.addEventListener('click', (e) => {
  const card = e.target.closest('[data-ev]');
  if (card && token && !e.target.closest('button')) { edOpen(card.dataset.ev); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (!token && !b.closest('#login')) return; // без входа панель не рисуется
  if (/^ed[a-z0-9]+$/.test(b.id)) return edClick(b.id);
  if (b.dataset.tab) { tab = b.dataset.tab; render(); return; } // загрузку журнала запускает rRequests, один запрос
  if (b.dataset.go) { if (isDate(b.dataset.go)) { cur = b.dataset.go; view = 'day'; render(); } return; }
  const go = (d) => { cur = d; render(); }; // загрузку недели запускает rSchedule, один запрос
  switch (b.id) {
    case 'prev': return go(view === 'day' ? add(cur, -1) : add(weekStart(cur), -7));
    case 'next': return go(view === 'day' ? add(cur, 1) : add(weekStart(cur), 7));
    case 'tod': return go(tzToday());
    case 'vd': view = 'day'; return render();
    case 'vw': view = 'week'; return render();
    // Повторное нажатие, пока загрузка идёт, второй запрос не отправляет.
    case 'refresh': case 'wretry': { const ws = weekStart(cur); if (inflight['w:' + ws]) return; delete weeks[ws]; return go(cur); }
    case 'rrefresh': case 'rretry': if (inflight.r) return; reqs = null; return render();
    case 'logout': try { sessionStorage.removeItem(NB_KEY); sessionStorage.removeItem(ED_KEY); } catch (x) {} nb = null; ed = null; clearSession(); try { google.accounts.id.disableAutoSelect(); } catch (x) {} $('#login').hidden = false; $('#lmsg').innerHTML = '<p class="mut">Вы вышли.</p>'; return;
  }
});
document.addEventListener('keydown', (e) => { const c = e.target.closest && e.target.closest('[data-ev]'); if (c && token && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); edOpen(c.dataset.ev); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !token) return;
  const w = weeks[weekStart(cur)];
  if (w && !w.loading && Date.now() - w.at > FRESH) { loadWeek(weekStart(cur), true).then(rerender, rerender); loadRequests(true); }
});
initGoogle();
}
